name: Deploy to Production

on:
  repository_dispatch:
    types: [ghost-publish]
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          PUBLIC_GHOST_API_URL: ${{ secrets.PUBLIC_GHOST_API_URL }}
          PUBLIC_GHOST_CONTENT_API_KEY: ${{ secrets.PUBLIC_GHOST_CONTENT_API_KEY }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync static assets to S3 (long cache)
        run: |
          aws s3 sync dist/ "s3://${{ secrets.S3_BUCKET_NAME }}/" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "*.json"

      - name: Sync HTML files to S3 (no cache)
        run: |
          aws s3 sync dist/ "s3://${{ secrets.S3_BUCKET_NAME }}/" \
            --cache-control "public, max-age=0, must-revalidate" \
            --content-type "text/html" \
            --exclude "*" \
            --include "*.html"

      - name: Sync JSON files to S3 (no cache)
        run: |
          aws s3 sync dist/ "s3://${{ secrets.S3_BUCKET_NAME }}/" \
            --cache-control "public, max-age=0, must-revalidate" \
            --content-type "application/json" \
            --exclude "*" \
            --include "*.json"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
