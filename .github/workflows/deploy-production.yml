name: Promote to Production

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify build environment
        run: |
          missing=0
          for name in \
            PUBLIC_KIT_API_KEY \
            PUBLIC_KIT_FORM_ID \
            PUBLIC_KIT_DEMO_TAG_ID \
            PUBLIC_KIT_WHITEPAPER_FORM_ID \
            PUBLIC_KIT_WHITEPAPER_TAG_ID
          do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set for this workflow run."
              missing=1
            fi
          done
          if { [ -n "$PUBLIC_GHOST_API_URL" ] && [ -z "$PUBLIC_GHOST_CONTENT_API_KEY" ]; } || \
             { [ -z "$PUBLIC_GHOST_API_URL" ] && [ -n "$PUBLIC_GHOST_CONTENT_API_KEY" ]; }; then
            echo "::error::Set both PUBLIC_GHOST_API_URL and PUBLIC_GHOST_CONTENT_API_KEY, or unset both to skip Ghost blog generation."
            missing=1
          fi
          exit "$missing"
        env:
          PUBLIC_GHOST_API_URL: ${{ secrets.PUBLIC_GHOST_API_URL }}
          PUBLIC_GHOST_CONTENT_API_KEY: ${{ secrets.PUBLIC_GHOST_CONTENT_API_KEY }}
          PUBLIC_KIT_API_KEY: ${{ secrets.PUBLIC_KIT_API_KEY }}
          PUBLIC_KIT_FORM_ID: ${{ secrets.PUBLIC_KIT_FORM_ID }}
          PUBLIC_KIT_DEMO_TAG_ID: ${{ secrets.PUBLIC_KIT_DEMO_TAG_ID }}
          PUBLIC_KIT_WHITEPAPER_FORM_ID: ${{ secrets.PUBLIC_KIT_WHITEPAPER_FORM_ID }}
          PUBLIC_KIT_WHITEPAPER_TAG_ID: ${{ secrets.PUBLIC_KIT_WHITEPAPER_TAG_ID }}

      - name: Verify Ghost content API
        run: |
          if [ -z "$PUBLIC_GHOST_API_URL" ] && [ -z "$PUBLIC_GHOST_CONTENT_API_KEY" ]; then
            echo "Ghost blog generation disabled for this build."
            exit 0
          fi

          status=$(curl -sS -o /tmp/ghost-check.json -w "%{http_code}" \
            "${PUBLIC_GHOST_API_URL%/}/ghost/api/content/posts/?key=${PUBLIC_GHOST_CONTENT_API_KEY}&limit=1")

          if [ "$status" != "200" ]; then
            echo "::error::Ghost Content API returned HTTP $status. Check PUBLIC_GHOST_API_URL / PUBLIC_GHOST_CONTENT_API_KEY and the Ghost site status, or unset both secrets to skip blog generation."
            exit 1
          fi
        env:
          PUBLIC_GHOST_API_URL: ${{ secrets.PUBLIC_GHOST_API_URL }}
          PUBLIC_GHOST_CONTENT_API_KEY: ${{ secrets.PUBLIC_GHOST_CONTENT_API_KEY }}

      - name: Build site
        run: npm run build
        env:
          PUBLIC_GHOST_API_URL: ${{ secrets.PUBLIC_GHOST_API_URL }}
          PUBLIC_GHOST_CONTENT_API_KEY: ${{ secrets.PUBLIC_GHOST_CONTENT_API_KEY }}
          PUBLIC_KIT_API_KEY: ${{ secrets.PUBLIC_KIT_API_KEY }}
          PUBLIC_KIT_FORM_ID: ${{ secrets.PUBLIC_KIT_FORM_ID }}
          PUBLIC_KIT_DEMO_TAG_ID: ${{ secrets.PUBLIC_KIT_DEMO_TAG_ID }}
          PUBLIC_KIT_WHITEPAPER_FORM_ID: ${{ secrets.PUBLIC_KIT_WHITEPAPER_FORM_ID }}
          PUBLIC_KIT_WHITEPAPER_TAG_ID: ${{ secrets.PUBLIC_KIT_WHITEPAPER_TAG_ID }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync static assets to S3 (long cache)
        run: |
          aws s3 sync dist/ "s3://${{ secrets.S3_BUCKET_NAME }}/" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "*.json"

      - name: Sync HTML files to S3 (no cache)
        run: |
          aws s3 sync dist/ "s3://${{ secrets.S3_BUCKET_NAME }}/" \
            --cache-control "public, max-age=0, must-revalidate" \
            --content-type "text/html" \
            --exclude "*" \
            --include "*.html"

      - name: Sync JSON files to S3 (no cache)
        run: |
          aws s3 sync dist/ "s3://${{ secrets.S3_BUCKET_NAME }}/" \
            --cache-control "public, max-age=0, must-revalidate" \
            --content-type "application/json" \
            --exclude "*" \
            --include "*.json"

      - name: Set S3 301 redirects for old blog slugs
        run: |
          BUCKET="${{ secrets.S3_BUCKET_NAME }}"

          # /blog/iso-20022-paradox-message-migration → renamed slug
          aws s3api put-object \
            --bucket "$BUCKET" \
            --key "blog/iso-20022-paradox-message-migration/index.html" \
            --website-redirect-location "/blog/the-iso-20022-paradox-why-message-migration-is-the-easy-part" \
            --content-type "text/html"

          # /blog/why-your-sanctions-screening-is-only-as-good-as-your-address-data → deleted, redirect to blog index
          aws s3api put-object \
            --bucket "$BUCKET" \
            --key "blog/why-your-sanctions-screening-is-only-as-good-as-your-address-data/index.html" \
            --website-redirect-location "/blogs" \
            --content-type "text/html"

          echo "S3 301 redirects configured for 2 old blog slugs."

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

      - name: Notify Bing IndexNow
        run: |
          SITE="https://ionova.ai"
          KEY="9b529d484b3f4c6e8fa5738595469ee7"

          # Extract all URLs from built sitemap files
          URLS=$(grep -ohP '(?<=<loc>)[^<]+' dist/sitemap-*.xml | sort -u)
          URL_COUNT=$(echo "$URLS" | wc -l | tr -d ' ')

          # Build JSON array
          URL_JSON=$(echo "$URLS" | awk '{printf "    \"%s\"", $0; if (NR>0) printf ",\n"}' | sed '$ s/,$//')

          echo "Submitting ${URL_COUNT} URLs to IndexNow..."

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{
              \"host\": \"ionova.ai\",
              \"key\": \"${KEY}\",
              \"keyLocation\": \"${SITE}/${KEY}.txt\",
              \"urlList\": [
          ${URL_JSON}
              ]
            }")

          echo "IndexNow response: HTTP ${RESPONSE}"
          if [ "$RESPONSE" != "200" ] && [ "$RESPONSE" != "202" ]; then
            echo "Warning: IndexNow returned unexpected status. URLs may not have been submitted."
          fi
